name: Publish Motionfield
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download public website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download motionfield-public-v42 --pattern '*.zip' --dir release
      - name: Verify and unpack
        run: |
          echo "f58f871b28557255d67948c114db7615accea0f7acc1130bb14822c2e0edfd21  release/motionfield-public-v42.zip" | sha256sum --check
          echo "f36382ecc9debee1de62c85ca785933ced39a765969412bc7eb4aed3816331de  release/image-final-fixes-v42.zip" | sha256sum --check
          mkdir site
          unzip -q release/motionfield-public-v42.zip -d site
          unzip -oq release/image-final-fixes-v42.zip -d site
          test -f site/index.html
          test -f site/videos.html
          test -f site/images.html
          test -f site/fonts.html
          test -f site/template-library/v1/current.json
          test -f site/design-library/v1/current.json
          test ! -e site/workbench.html
          test ! -e site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
